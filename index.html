<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Ruang Baca</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 30%, rgba(13, 202, 240, .55), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(255, 87, 34, .65), transparent 40%),
        radial-gradient(circle at 70% 85%, rgba(220, 53, 69, .6), transparent 45%),
        radial-gradient(circle at 10% 90%, rgba(111, 66, 193, .5), transparent 40%),
        #07142e;
      background-attachment: fixed;
    }

    .glass-card {
      background: rgba(255, 255, 255, .12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
    }

    .glass-card .form-control {
      background: rgba(255, 255, 255, .15);
      border: 1px solid rgba(255, 255, 255, .35);
      color: #fff;
    }
    .glass-card .form-control::placeholder { color: rgba(255, 255, 255, .7); }
    .glass-card .form-control:focus {
      background: rgba(255, 255, 255, .22);
      box-shadow: 0 0 0 .2rem rgba(255, 255, 255, .25);
      border-color: #fff;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-dark">
    <div class="container-fluid px-md-5">
      <a class="navbar-brand fw-semibold" href="#">Ruang Baca</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuNav" aria-controls="menuNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-lg-5">
    <div class="row align-items-center justify-content-between min-vh-75">

      <div class="col-lg-6 d-none d-lg-block text-white">
        <p class="text-uppercase small mb-2">Perpustakaan digital</p>
        <h1 class="display-4 fw-bold">Temukan bacaan favoritmu, dalam satu tempat.</h1>
        <div class="mt-4">
          <span class="badge rounded-pill border border-light bg-transparent px-3 py-2 me-2">Novel</span>
          <span class="badge rounded-pill border border-light bg-transparent px-3 py-2">Jurnal</span>
        </div>
      </div>

      <div class="col-12 col-sm-10 col-md-7 col-lg-4 mx-auto mx-lg-0">
        <div class="card glass-card rounded-4 shadow-lg">
          <div class="card-body p-4">
            <h3 class="fw-bold mb-1">Masuk</h3>
            <p class="small mb-4">Senang bertemu lagi.</p>

            <form>
              <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Username</label>
                <input type="text" class="form-control rounded-pill" id="username" placeholder="Masukkan username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">Password</label>
                <input type="password" class="form-control rounded-pill" id="password" placeholder="Masukkan password">
              </div>

              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="ingat">
                  <label class="form-check-label small" for="ingat">Ingat saya</label>
                </div>
                <a href="#" class="small text-white">Lupa password?</a>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-light rounded-pill fw-semibold py-2">Masuk &rarr;</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
